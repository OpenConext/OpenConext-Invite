ServerName accessclient
RewriteEngine On

# Strip the /roles prefix and flag the request, then continue processing rules
RewriteRule ^/roles/?$ / [E=ROLES_PREFIX:1]
RewriteRule ^/roles/(.*)$ /$1 [E=ROLES_PREFIX:1]

# Pass backend/proxy routes to mod_proxy using the rewritten URI ([PT] is required)
RewriteRule ^/(api|crm|login|oauth2|ui|internal|deprovision)(/.*)?$ - [PT,L]

# SPA fallback: check against $1 (the rewritten URI) rather than %{REQUEST_URI}
RewriteCond $1 !\.(js|css)(\.map)?$
RewriteCond $1 !\.(svg|png|ico|woff|woff2|ttf|wav|eot)$
RewriteCond $1 !^/(asset-)?manifest\.json$
RewriteCond %{DOCUMENT_ROOT}$1 !-f
RewriteRule ^(.*)$ /index.html [L]

ProxyPass /api http://inviteserver:8080/api retry=0
ProxyPassReverse /api http://inviteserver:8080/api
ProxyPass /oauth2 http://inviteserver:8080/oauth2
ProxyPassReverse /oauth2 http://inviteserver:8080/oauth2
ProxyPass /internal http://inviteserver:8080/internal
ProxyPassReverse /internal http://inviteserver:8080/internal
ProxyPass /login http://inviteserver:8080/login
ProxyPassReverse /login http://inviteserver:8080/login
ProxyPass /ui http://inviteserver:8080/ui
ProxyPassReverse /ui http://inviteserver:8080/ui
ProxyPass /deprovision http://inviteserver:8080/api
ProxyPassReverse /deprovision http://inviteserver:8080/api
ProxyPass /crm http://inviteserver:8080/crm
ProxyPassReverse /crm http://inviteserver:8080/crm

DocumentRoot /var/www/

<Location "/api">
    ProxyPreserveHost On
</Location>
<Location "/oauth2">
    ProxyPreserveHost On
</Location>
<Location "/internal">
    ProxyPreserveHost On
</Location>
<Location "/login">
    ProxyPreserveHost On
</Location>

<Directory /var/www>
    Require all granted
    Options -Indexes
</Directory>

<FilesMatch "\.html$">
    Header set Cache-Control "max-age=0, no-cache, no-store, must-revalidate"
    Header set Expires "Sun, 8 Jun 1986 08:06:00 GMT"
</FilesMatch>

Header always set X-Frame-Options "DENY"
Header always set Referrer-Policy "strict-origin-when-cross-origin"
Header always set X-Content-Type-Options "nosniff"

# Rewrite root-relative HTML links and redirect Location headers when accessed under /roles/
<If "reqenv('ROLES_PREFIX') == '1'">
    Header edit Location ^(https?://[^/]+)?/(?!roles/)(.*)$ $1/roles/$2
    <IfModule mod_substitute.c>
        AddOutputFilterByType SUBSTITUTE text/html
        Substitute "s|href=([\"'])/([^/])|href=$1/roles/$2|i"
        Substitute "s|src=([\"'])/([^/])|src=$1/roles/$2|i"
        Substitute "s|action=([\"'])/([^/])|action=$1/roles/$2|i"
    </IfModule>
</If>
